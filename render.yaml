# Render Blueprint: 저장소를 연결하면 이 파일로 웹 서비스와 영구 디스크가 만들어진다.
# H2 파일 DB 와 증적 파일을 디스크(/var/data)에 두므로, 디스크를 쓸 수 있는 유료 플랜이 필요하다.
# (무료 플랜은 재배포·유휴 종료 때마다 파일이 지워져 DB 가 초기화된다.)
services:
  - type: web
    name: it-audit
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    autoDeploy: true
    disk:
      name: it-audit-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_DATA_DIR
        value: /var/data
      # 최초 관리자(admin) 비밀번호. 자동 생성되며 Render 대시보드의 Environment 에서 확인한다.
      # 첫 로그인 때 변경이 강제된다.
      - key: APP_INIT_ADMIN_PASSWORD
        generateValue: true
      # 시연용 역할 선택 데모 로그인을 켠다. 주소를 아는 누구나 역할을 골라 들어올 수 있으니
      # 실제 데이터를 넣기 전에는 "false" 로 바꾼다.
      - key: DEMO_LOGIN_ENABLED
        value: "true"
      # 데모 서버는 재배포로 DB 가 비어도 시연용 데이터(체크리스트·회차·개선사항 등)가 자동으로 다시 채워진다.
      # DB 가 비어 있을 때만 만들고, 데이터가 있으면 건드리지 않는다. 실제 운영에서는 "false".
      - key: DEMO_DATA_ENABLED
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
