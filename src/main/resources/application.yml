spring:
  application:
    name: it-audit
  datasource:
    # H2 파일 모드 (개발·운영 공통). DB 파일은 실행 위치의 data/db 아래에 생성된다.
    url: jdbc:h2:file:${app.data-dir}/db/itaudit
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration
  thymeleaf:
    cache: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.itaudit
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL

app:
  data-dir: ./data
  # 최초 기동 시 관리자 계정이 하나도 없으면 생성한다. 첫 로그인 후 비밀번호 변경이 강제된다.
  init-admin:
    login-id: admin
    password: ${APP_INIT_ADMIN_PASSWORD:admin1234!}
