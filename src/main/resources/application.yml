spring:
  application:
    name: it-audit
  datasource:
    # H2 파일 모드 (개발·운영 공통). DB 파일은 실행 위치의 data/db 아래에 생성된다.
    url: jdbc:h2:file:${app.data-dir}/db/itaudit
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration
  thymeleaf:
    cache: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

server:
  # Render 등 PaaS 는 PORT 환경변수로 포트를 지정한다
  port: ${PORT:8080}
  # 종료 신호(SIGTERM)를 받으면 진행 중 요청을 마치고 내려가, H2 파일이 깨지지 않게 한다
  shutdown: graceful
  # 리버스 프록시(Render 의 HTTPS 종단) 뒤에서 원래 요청의 스킴·호스트를 쓰도록
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        # HTTPS 로만 쿠키를 보낸다. 로컬 HTTP 개발에서는 false (Render 에서는 true 로 설정)
        secure: ${COOKIE_SECURE:false}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.itaudit
  configuration:
    map-underscore-to-camel-case: true
    # 1차 캐시를 문장 단위로: 같은 트랜잭션 안에서 갱신 후 다시 읽을 때 오래된 값을 받지 않도록
    local-cache-scope: statement
    jdbc-type-for-null: NULL

app:
  # DB(data-dir/db)와 증적 파일(data-dir/files) 위치. Render 에서는 영구 디스크 경로(예: /var/data)
  data-dir: ${APP_DATA_DIR:./data}
  # 시연용 역할 선택 로그인. 로그인 화면에서 역할을 고르면 데모 계정으로 바로 들어간다.
  # 인터넷에 공개되는 서버·사내 운영에서는 반드시 false 로 끈다 (DEMO_LOGIN_ENABLED=false).
  demo-login:
    enabled: ${DEMO_LOGIN_ENABLED:true}
  # 시연용 데이터: 앱이 빈 DB 로 뜰 때 체크리스트·회차 3개·점검 입력·적정성 점검·개선사항·코멘트를 한 번만 만든다.
  # DB 가 재배포마다 초기화되는 데모 서버용. demo-login 이 켜져 있어야 한다 (DEMO_DATA_ENABLED=true).
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
  # 최초 기동 시 관리자 계정이 하나도 없으면 생성한다. 첫 로그인 후 비밀번호 변경이 강제된다.
  init-admin:
    login-id: admin
    password: ${APP_INIT_ADMIN_PASSWORD:admin1234!}
