spring:
  application:
    name: it-audit
  datasource:
    # H2 파일 모드 (개발·운영 공통). DB 파일은 실행 위치의 data/db 아래에 생성된다.
    url: jdbc:h2:file:${app.data-dir}/db/itaudit
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration
  thymeleaf:
    cache: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.itaudit
  configuration:
    map-underscore-to-camel-case: true
    # 1차 캐시를 문장 단위로: 같은 트랜잭션 안에서 갱신 후 다시 읽을 때 오래된 값을 받지 않도록
    local-cache-scope: statement
    jdbc-type-for-null: NULL

app:
  data-dir: ./data
  # 시연용 역할 선택 로그인. 로그인 화면에서 역할을 고르면 데모 계정으로 바로 들어간다.
  # 사내 도입·운영 시에는 반드시 false 로 끈다 (실행 시 --app.demo-login.enabled=false).
  demo-login:
    enabled: true
  # 최초 기동 시 관리자 계정이 하나도 없으면 생성한다. 첫 로그인 후 비밀번호 변경이 강제된다.
  init-admin:
    login-id: admin
    password: ${APP_INIT_ADMIN_PASSWORD:admin1234!}
