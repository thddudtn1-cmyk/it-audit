<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('분기 회차 목록')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <h2>분기 회차 목록</h2>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="toolbar">
        <span th:text="|회차 ${#lists.size(rounds)}개|">회차 0개</span>
        <span class="toolbar__actions" sec:authorize="hasRole('AUDIT_LEAD')">
            <button type="submit" form="delete-form" class="button button--danger" id="delete-button" disabled
                    th:if="${!#lists.isEmpty(rounds)}">선택 삭제</button>
            <a class="button button--primary" th:href="@{/rounds/new}">회차 생성</a>
        </span>
    </div>
    <form id="delete-form" th:action="@{/rounds/delete}" method="post"
          data-confirm="선택한 회차와 그 안의 점검 입력·증적 파일·적정성 점검 기록·코멘트와 자동 등록된 개선사항이 모두 삭제되며 되돌릴 수 없습니다. 계속할까요?">
    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th class="col-check" sec:authorize="hasRole('AUDIT_LEAD')"><input type="checkbox" id="check-all" title="삭제할 수 있는 회차 전체 선택" aria-label="전체 선택"></th>
                <th>회차</th><th class="num">대상 항목</th><th class="num">제외</th><th class="num">배정</th>
                <th>제출률</th><th>상태</th><th>생성일</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${rounds}">
                <td class="col-check" sec:authorize="hasRole('AUDIT_LEAD')">
                    <input type="checkbox" name="roundIds" th:value="${r.roundId}" class="row-check"
                           th:disabled="${r.improvementCount > 0}"
                           th:title="${r.improvementCount > 0} ? |조치가 진행·종결됐거나 직접 등록한 개선사항·권고사항 ${r.improvementCount}건이 연결되어 삭제할 수 없습니다| : '삭제 선택'"
                           th:attr="aria-label=|${r.label} 선택|">
                </td>
                <td><a th:href="@{/rounds/{id}(id=${r.roundId})}" th:text="${r.label}">2026년 3분기</a></td>
                <td class="num" th:text="${r.targetCount}">14</td>
                <td class="num" th:text="${r.excludedCount}">1</td>
                <td class="num" th:text="|${r.assignedCount} / ${r.targetCount}|">0 / 14</td>
                <td>
                    <div class="progress"><div class="progress__bar" th:style="|width: ${r.submitRate}%|"></div></div>
                    <span class="small" th:text="|${r.submitRate}% (${r.submittedCount}/${r.submitTargetCount})|">0%</span>
                </td>
                <td><span class="tag" th:classappend="|status--${r.status.name().toLowerCase()}|" th:text="${r.status.label}">작성중</span></td>
                <td th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd')}">2026-07-01</td>
            </tr>
            <tr th:if="${#lists.isEmpty(rounds)}">
                <td colspan="8" class="empty">
                    <span sec:authorize="hasRole('AUDIT_DEPT')">감사부서에 제출된 회차가 없습니다.</span>
                    <span sec:authorize="!hasRole('AUDIT_DEPT')">아직 만든 회차가 없습니다.</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    </form>
</main>
<script th:src="@{/js/checklist.js}"></script>
</body>
</html>
