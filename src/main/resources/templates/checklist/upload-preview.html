<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('업로드 미리보기')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container container--wide" th:with="p=${preview}">
    <h2>업로드 미리보기</h2>

    <div class="alert alert--error" th:each="e : ${p.fileErrors}" th:text="${e}">파일 오류</div>
    <div class="alert alert--error" th:if="${p.errorRowCount > 0}"
         th:text="|오류가 있는 행이 ${p.errorRowCount}개 있습니다. 엑셀을 고쳐 다시 올리세요.|">오류</div>
    <div class="alert alert--warn" th:if="${p.valid and p.existingCount > 0}"
         th:text="|${p.applyYear}년에 이미 ${p.existingCount}건이 있습니다. 확정하면 기존 항목을 모두 이 파일 내용으로 대체합니다.|">대체 경고</div>

    <div class="summary">
        <span><strong>파일</strong> <span th:text="${p.fileName}">file.xlsx</span>
            <span class="muted" th:if="${p.sheetName}" th:text="|(시트: ${p.sheetName})|"></span></span>
        <span><strong>적용연도</strong> <span th:text="|${p.applyYear}년|">2026년</span></span>
        <span><strong>항목 상세</strong> <span th:text="|${#lists.size(p.rows)}건|">0건</span></span>
        <span th:each="e : ${p.periodCounts}"><strong th:text="${e.key.label}">1분기</strong> <span th:text="${e.value}">0</span></span>
        <span th:if="${p.inheritedCount > 0}" class="muted" th:text="|감사 항목을 위 행에서 이어받은 행 ${p.inheritedCount}개|"></span>
    </div>

    <div class="table-wrap" th:if="${!#lists.isEmpty(p.rows)}">
        <table class="table table--checklist">
            <thead>
            <tr>
                <th class="col-no">엑셀 행</th>
                <th class="col-no">순번</th>
                <th class="col-area">감사 영역</th>
                <th class="col-item">감사 항목</th>
                <th>항목 상세</th>
                <th class="col-period">감사 시기</th>
                <th class="col-reg">법규/규정</th>
            </tr>
            </thead>
            <tbody>
            <th:block th:each="r : ${p.rows}">
                <tr th:classappend="${r.hasError()} ? 'row--error'">
                    <td class="num muted" th:text="${r.excelRow}">4</td>
                    <td class="num" th:text="${r.seqText}">1</td>
                    <td th:text="${r.auditArea != null} ? ${r.auditArea.label} : ${r.areaText}">영역</td>
                    <td>
                        <span th:text="${r.auditItem}">항목</span>
                        <span class="tag" th:if="${r.auditItemInherited}" title="빈 칸이라 위 행 값을 이어받음">위 행</span>
                    </td>
                    <td class="pre" th:text="${r.itemDetail}">상세</td>
                    <td th:text="${r.periodText}">1분기</td>
                    <td class="pre small" th:text="${r.regulation}">규정</td>
                </tr>
                <tr th:if="${r.hasError()}" class="row--error-detail">
                    <td></td>
                    <td colspan="6">
                        <span th:each="e, s : ${r.errors}" th:text="${e} + (${s.last} ? '' : ' / ')">오류</span>
                    </td>
                </tr>
            </th:block>
            </tbody>
        </table>
    </div>

    <div class="form__actions">
        <form th:action="@{/checklist/upload/cancel}" method="post" class="inline">
            <button type="submit" class="button">취소</button>
        </form>
        <a class="button" th:href="@{/checklist/upload(year=${p.applyYear})}">다른 파일 올리기</a>
        <form th:action="@{/checklist/upload/confirm}" method="post" class="inline" th:if="${p.valid}">
            <button type="submit" class="button button--primary" th:text="|${#lists.size(p.rows)}건 등록 확정|">확정</button>
        </form>
    </div>
</main>
</body>
</html>
