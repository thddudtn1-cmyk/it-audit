<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('비밀번호 변경')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container container--narrow">
    <h2>비밀번호 변경</h2>
    <div class="alert alert--warn" th:if="${loginUser.passwordChangeRequired}">
        초기 비밀번호로 로그인했습니다. 계속하려면 비밀번호를 변경하세요.
    </div>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <form th:action="@{/account/password}" method="post" class="form">
        <label>현재 비밀번호
            <input type="password" name="currentPassword" autocomplete="current-password" required>
        </label>
        <label>새 비밀번호
            <input type="password" name="newPassword" autocomplete="new-password" required>
            <small th:text="${policy}">규칙</small>
        </label>
        <label>새 비밀번호 확인
            <input type="password" name="confirmPassword" autocomplete="new-password" required>
        </label>
        <div class="form__actions">
            <button type="submit" class="button button--primary">변경</button>
        </div>
    </form>
</main>
</body>
</html>
