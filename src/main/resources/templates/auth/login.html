<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body class="login-page">
<main class="login-box">
    <h1>IT 자체감사 관리</h1>
    <div class="alert alert--error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</div>
    <div class="alert alert--info" th:if="${param.logout}">로그아웃했습니다.</div>
    <div class="alert alert--info" th:if="${param.expired}">세션이 만료되었습니다. 다시 로그인하세요.</div>
    <form th:action="@{/login}" method="post">
        <label>아이디
            <input type="text" name="loginId" autocomplete="username" required autofocus>
        </label>
        <label>비밀번호
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="button button--primary button--block">로그인</button>
    </form>
</main>
</body>
</html>
