<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(|${round.label} #${item.seqNo} 적정성 점검|)}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <div class="page-title">
        <h2 th:text="|${round.label} · ${item.auditItem}|">적정성 점검</h2>
        <span th:replace="~{request/fragments :: state(${state}, ${review})}"></span>
    </div>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="alert alert--error" th:if="${review != null and review.status.name() == 'REQUESTED' and review.deptComment != null}"
         th:text="|감사부서 의견: ${review.deptComment}|">의견</div>

    <!-- 분기 점검 내역 (담당자가 제출한 내용) -->
    <section class="panel">
        <h3>분기 점검 내역</h3>
        <dl class="info-grid">
            <dt>감사 영역</dt><dd th:text="${item.auditArea.label}">영역</dd>
            <dt>평가항목</dt><dd th:text="${item.auditItem}">항목</dd>
            <dt>법규/규정</dt><dd class="pre" th:text="${item.regulation} ?: '-'">규정</dd>
            <dt>점검방식</dt><dd class="pre" th:text="${item.itemDetail}">상세</dd>
            <dt>담당</dt><dd th:text="|${item.teamName ?: '-'} / ${item.assigneeName ?: '미배정'}|">담당</dd>
            <dt>점검결과</dt><dd><span th:replace="~{fragments/common :: resultTag(${item.inspectionResult})}"></span></dd>
            <dt>점검 내용 상세</dt><dd class="pre" th:text="${item.inspectionDetail} ?: '-'">내용</dd>
            <dt>비고1</dt><dd class="pre" th:text="${item.remark1} ?: '-'">비고</dd>
            <dt>조치내용</dt>
            <dd class="pre"><span th:text="${item.actionPlan} ?: '-'"></span>
                <span th:if="${item.plannedDate}" th:text="|(개선 예정일 ${item.plannedDate})|"></span></dd>
            <dt>점검 증적</dt>
            <dd>
                <span th:each="e, s : ${itemEvidences}">
                    <a th:href="@{/evidence/{id}(id=${e.evidenceId})}" th:text="${e.originalName}">파일</a><span th:unless="${s.last}">, </span>
                </span>
                <span th:if="${#lists.isEmpty(itemEvidences)}" class="muted">없음</span>
            </dd>
        </dl>
    </section>

    <!-- 보완자료 (요청 → 담당자 제출) -->
    <th:block th:if="${review != null and review.requestMaterial != null}">
        <form th:action="@{/requests/{id}/submission(id=${review.requestId})}" method="post" enctype="multipart/form-data" class="form panel">
            <h3>보완자료</h3>
            <dl class="info-grid">
                <dt>요청 자료</dt>
                <dd class="pre"><strong th:text="${review.requestMaterial}">요청</strong></dd>
                <dt>요청일</dt><dd th:text="${#temporals.format(review.requestedAt, 'yyyy-MM-dd HH:mm')}">-</dd>
            </dl>
            <fieldset th:disabled="${!canSubmit}">
                <label>비고
                    <textarea name="remark" rows="3" maxlength="1000" th:text="${remark}" placeholder="예: 26년 4분기 내 조치"></textarea>
                </label>
                <div class="form-row">
                    <span class="form-row__label">제출 파일</span>
                    <ul class="file-list">
                        <li th:each="e : ${evidences}">
                            <a th:href="@{/evidence/{id}(id=${e.evidenceId})}" th:text="${e.originalName}">파일</a>
                            <span class="muted small" th:text="|${e.sizeLabel} · ${e.uploaderName} · ${#temporals.format(e.uploadedAt, 'MM-dd HH:mm')}|"></span>
                            <button type="submit" class="link-button small" th:if="${canSubmit}" th:attr="form=|delete-${e.evidenceId}|">삭제</button>
                        </li>
                        <li th:if="${#lists.isEmpty(evidences)}" class="muted">제출한 파일이 없습니다.</li>
                    </ul>
                    <input type="file" name="files" multiple th:if="${canSubmit}" accept=".pdf,.xlsx,.docx,.png,.jpg,.jpeg,.zip,.txt">
                </div>
            </fieldset>
            <p class="small muted" th:if="${!canSubmit and loginUser.role.name() == 'INSPECTOR'}" th:text="${submitBlockReason}"></p>
            <p class="small muted" th:if="${review.submittedAt != null}" th:text="|제출일 ${#temporals.format(review.submittedAt, 'yyyy-MM-dd HH:mm')}|"></p>
            <div class="form__actions" th:if="${canSubmit}">
                <button type="submit" name="action" value="save" class="button">임시저장</button>
                <button type="submit" name="action" value="submit" class="button button--primary">제출</button>
            </div>
        </form>
        <form th:each="e : ${evidences}" th:if="${canSubmit}" th:id="|delete-${e.evidenceId}|" method="post"
              th:action="@{/evidence/{id}/delete(id=${e.evidenceId})}" hidden>
            <input type="hidden" name="returnUrl" th:value="|/requests/items/${item.roundItemId}|">
        </form>
    </th:block>

    <!-- 판정 결과 (읽기) -->
    <section class="panel" th:if="${review != null and review.findingYn != null and !canReview}">
        <h3>적정성 판정</h3>
        <dl class="info-grid">
            <dt>판정</dt><dd><span th:replace="~{request/fragments :: state(${state}, ${review})}"></span></dd>
            <dt th:if="${review.findingDetail}">미흡 내용</dt><dd th:if="${review.findingDetail}" class="pre" th:text="${review.findingDetail}"></dd>
            <dt th:if="${review.deptComment}">검토 의견</dt><dd th:if="${review.deptComment}" class="pre" th:text="${review.deptComment}"></dd>
        </dl>
    </section>
    <div class="alert alert--info" th:if="${reviewBlockReason != null}" th:text="${reviewBlockReason}">안내</div>

    <!-- 감사부서 검토 -->
    <form th:if="${canReview}" th:object="${reviewForm}" th:action="@{/requests/items/{id}/review(id=${item.roundItemId})}"
          method="post" class="form panel" data-review-form>
        <h3>적정성 검토</h3>
        <div class="form-row">
            <label class="checkbox"><input type="radio" th:field="*{decision}" value="NO_FINDING" required> 적정 (이상 없음)</label>
            <label class="checkbox"><input type="radio" th:field="*{decision}" value="FINDING"> 미흡 확정 (개선사항 관리대장 등록 대상)</label>
            <label class="checkbox"><input type="radio" th:field="*{decision}" value="SUPPLEMENT"> 보완자료 요청 (담당자에게 요청)</label>
        </div>
        <div data-decision-section="FINDING">
            <label>확정 점검결과 <small class="muted">미흡 확정 시 필수</small>
                <select th:field="*{confirmedResult}">
                    <option value="">선택</option>
                    <option th:each="r : ${findingResults}" th:value="${r}" th:text="|${r.label} — ${r.description}|">미흡</option>
                </select>
            </label>
            <label>미흡 내용 <small class="muted">미흡 확정 시 필수 · 개선사항의 '점검 내용 상세'로 이어집니다</small>
                <textarea th:field="*{findingDetail}" rows="3" maxlength="2000"></textarea>
            </label>
        </div>
        <div data-decision-section="SUPPLEMENT">
            <label>보완 요청 자료 <small class="muted">보완 요청 시 필수</small>
                <textarea th:field="*{requestMaterial}" rows="3" maxlength="1000" placeholder="예: 최근 3개월 계정 삭제 수행 이력"></textarea>
            </label>
        </div>
        <label>검토 의견 <small class="muted">선택 · 담당자에게도 보입니다</small>
            <textarea th:field="*{deptComment}" rows="2" maxlength="1000"></textarea>
        </label>
        <div class="form__actions">
            <a class="button" th:href="@{/requests(roundId=${round.roundId})}">목록</a>
            <button type="submit" class="button button--primary">저장</button>
        </div>
    </form>
    <div class="form__actions" th:unless="${canReview}">
        <a class="button" th:href="${loginUser.role.name() == 'INSPECTOR'} ? @{/requests} : @{/requests(roundId=${round.roundId})}">목록</a>
    </div>
</main>
<script th:src="@{/js/review.js}"></script>
</body>
</html>
