<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('사전요청자료 요청')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container container--wide">
    <h2 th:text="|${round.label} 사전요청자료 요청|">요청</h2>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <p class="small muted">요청할 항목을 체크하세요. 요청자료는 총괄표의 사전요청자료를 기본값으로 가져오며 고칠 수 있습니다.</p>

    <form th:action="@{/requests}" method="post">
        <input type="hidden" name="roundId" th:value="${round.roundId}">
        <div class="table-wrap">
            <table class="table table--checklist">
                <thead>
                <tr>
                    <th class="col-flag">요청</th>
                    <th class="col-no">순번</th>
                    <th class="col-item">평가항목</th>
                    <th>점검방식</th>
                    <th class="col-period">점검결과</th>
                    <th class="col-team">담당자</th>
                    <th class="col-material">요청자료</th>
                    <th class="col-sample">표본 수</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c, s : ${candidates}" th:with="i=${c.item()}, ex=${c.existing()}"
                    th:classappend="${ex != null} ? 'row--inactive'">
                    <td class="center">
                        <input type="hidden" th:name="|rows[${s.index}].roundItemId|" th:value="${i.roundItemId}">
                        <input type="checkbox" th:name="|rows[${s.index}].selected|" value="true" th:disabled="${ex != null}">
                    </td>
                    <td class="num" th:text="${i.seqNo}">8</td>
                    <td th:text="${i.auditItem}">항목</td>
                    <td class="pre small" th:text="${i.itemDetail}">상세</td>
                    <td><span th:replace="~{fragments/common :: resultTag(${i.inspectionResult})}"></span></td>
                    <td th:text="${i.assigneeName} ?: '-'">담당자</td>
                    <td>
                        <span th:if="${ex != null}" class="small">요청됨: <span th:text="${ex.requestMaterial}"></span></span>
                        <textarea th:if="${ex == null}" th:name="|rows[${s.index}].requestMaterial|" rows="2" maxlength="1000"
                                  class="input--block" th:text="${i.requestMaterial}"></textarea>
                    </td>
                    <td><input th:if="${ex == null}" type="number" min="0" class="input--short"
                               th:name="|rows[${s.index}].sampleSize|" th:value="${i.sampleSize}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="form__actions">
            <a class="button" th:href="@{/requests(roundId=${round.roundId})}">취소</a>
            <button type="submit" class="button button--primary">선택 항목 요청</button>
        </div>
    </form>
</main>
</body>
</html>
